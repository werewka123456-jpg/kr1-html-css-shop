<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки в учебном интернет-магазине.">
  <title>Оформление заявки – Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заявка</span>
    </nav>

    <section class="section">
      <h1>Оформление заявки</h1>
      <p>Заполните форму ниже, и мы свяжемся с вами.</p>

      <!-- Форма в стиле БЭМ -->
      <form class="order-form" action="#" method="post">
        <div class="order-form__field">
          <label class="order-form__label" for="name">Имя</label>
          <input class="order-form__input" id="name" name="name" type="text" placeholder="Введите ваше имя" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="email">E-mail</label>
          <input class="order-form__input" id="email" name="email" type="email" placeholder="example@mail.ru" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="comment">Комментарий</label>
          <textarea class="order-form__textarea" id="comment" name="comment" rows="4" placeholder="Укажите детали заказа"></textarea>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Отправить</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
  </footer>

</body>
</html>
